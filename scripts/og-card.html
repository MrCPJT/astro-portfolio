<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "NotoSans";
        src: url("../public/fonts/NotoSansKR-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "NotoSans";
        src: url("../public/fonts/NotoSansKR-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "NotoSans";
        src: url("../public/fonts/NotoSansKR-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #faf8f4;
        font-family: "NotoSans", system-ui, sans-serif;
        color: #1f1d1a;
      }
      .wrap {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 84px 96px;
      }
      .logo {
        height: 84px;
        width: auto;
      }
      .block {
        position: absolute;
        left: 96px;
        top: 236px;
        border-left: 8px solid #bc3f0b;
        padding-left: 44px;
      }
      h1 {
        font-size: 96px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -1px;
      }
      p.t {
        margin-top: 22px;
        font-size: 35px;
        font-weight: 400;
        color: #5c5852;
        line-height: 1.3;
        white-space: nowrap;
      }
      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 64px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 28px;
        color: #5c5852;
      }
      .foot b {
        font-weight: 500;
        color: #1f1d1a;
      }
      .dot {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #bc3f0b;
        margin-right: 14px;
        vertical-align: 1px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="../public/origami-crane-logo-light.png" />
      <div class="block">
        <h1>Connor Tynan</h1>
        <p class="t">Data Scientist working on uncertainty quantification</p>
      </div>
      <div class="foot">
        <span><span class="dot"></span><b>National Physical Laboratory</b></span
        ><span>cpjt.dev</span>
      </div>
    </div>
  </body>
</html>
