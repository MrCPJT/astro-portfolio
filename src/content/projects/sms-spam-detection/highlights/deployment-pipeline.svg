<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 456" width="560" height="456" role="img" aria-label="Deployment pipeline from notebook to API Gateway">
<rect width="560" height="456" fill="#ffffff"/>
<text x="20" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#1f1d1a">Deployment pipeline</text>
<text x="20" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#5c5852">From trained model to a callable endpoint</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5852"/></marker></defs>
<rect x="130.0" y="76" width="300" height="52" rx="8" fill="#f0ede6" stroke="#d6d1c7"/>
<text x="280.0" y="99" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1f1d1a">Notebook</text>
<text x="280.0" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5c5852">clean text, train SGD</text>
<line x1="280.0" y1="130" x2="280.0" y2="149" stroke="#5c5852" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130.0" y="152" width="300" height="52" rx="8" fill="#f0ede6" stroke="#d6d1c7"/>
<text x="280.0" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1f1d1a">Docker image</text>
<text x="280.0" y="194" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5c5852">model and handler</text>
<line x1="280.0" y1="206" x2="280.0" y2="225" stroke="#5c5852" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130.0" y="228" width="300" height="52" rx="8" fill="#f0ede6" stroke="#d6d1c7"/>
<text x="280.0" y="251" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1f1d1a">Amazon ECR</text>
<text x="280.0" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5c5852">image registry</text>
<line x1="280.0" y1="282" x2="280.0" y2="301" stroke="#5c5852" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130.0" y="304" width="300" height="52" rx="8" fill="#f0ede6" stroke="#d6d1c7"/>
<text x="280.0" y="327" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1f1d1a">AWS Lambda</text>
<text x="280.0" y="346" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5c5852">runs the container</text>
<line x1="280.0" y1="358" x2="280.0" y2="377" stroke="#5c5852" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130.0" y="380" width="300" height="52" rx="8" fill="#bc3f0b" stroke="#bc3f0b"/>
<text x="280.0" y="403" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">API Gateway</text>
<text x="280.0" y="422" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff">HTTPS endpoint</text>
</svg>