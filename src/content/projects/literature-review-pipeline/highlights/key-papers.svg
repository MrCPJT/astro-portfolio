<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Fate of 67 key papers across four finished reviews">
<rect width="560" height="330" fill="#ffffff"/>
<text x="20" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#1f1d1a">Where the key papers go</text>
<text x="20" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#5c5852">67 key papers from held-out surveys, four finished reviews</text>
<line x1="230.0" y1="70" x2="230.0" y2="302" stroke="#5c5852" stroke-width="1"/>
<text x="230.0" y="320" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5c5852">0</text>
